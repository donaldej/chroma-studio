; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = RFV3
default_envs = t-embed-cc1101-plus

[common]
framework = arduino
lib_deps =
    bblanchon/ArduinoJson@^6.17.3
    me-no-dev/ESPAsyncWebServer
    https://github.com/tzapu/WiFiManager.git#feature_asyncwebserver
    https://github.com/bitbank2/OneBitDisplay
; esp32 support doesn't exist in release yet,
; https://github.com/tzapu/WiFiManager/issues/1231#issuecomment-810598152

[base:esp8266]
monitor_speed = 500000
platform = espressif8266
framework = ${common.framework}
lib_deps = 
    ${common.lib_deps}
    me-no-dev/ESPAsyncTCP

[base:esp32]
monitor_speed = 500000
platform = espressif32
framework = ${common.framework}
lib_deps = ${common.lib_deps}

; [env:nodemcuv2]
; board = nodemcuv2
; extends = base:esp8266

; [env:d1_mini]
; board = d1_mini
; extends = base:esp8266

[env:esp32doit-devkit-v1]
board = esp32doit-devkit-v1
extends = base:esp32

[env:t-embed-cc1101-plus]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    -DCHROMA_T_EMBED_CC1101
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
monitor_speed = 500000
upload_speed = 460800
lib_deps =
    bblanchon/ArduinoJson@6.21.5
    https://github.com/tzapu/WiFiManager.git#6d41298669b3e9c0de682e9fb3426d3e5db11c39
    https://github.com/bitbank2/OneBitDisplay.git#b5d58574165b5873f4a74a262bf2e394295d37bc
    https://github.com/bitbank2/BitBang_I2C.git#4bca3bd8a0c4cd63f7e69a69ad6036b2f37cdb94
    adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
    adafruit/Adafruit GFX Library@1.13.0
    adafruit/Adafruit BusIO@1.17.4
    adafruit/Adafruit seesaw Library@1.7.9

# esp32dev works for the majority of ESP32 based dev boards
;[env:esp32dev]
;board = esp32dev
;extends = base:esp32
